{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<div style="background: linear-gradient(135deg, #0f172a, #1e293b); border: 1px solid #0284c7; border-radius: 10px; padding: 20px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.2);">
    <div>
        <h2 style="margin: 0 0 6px 0; color: #38bdf8; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
            <span>💾</span> NEONDROP BACKUP / RESTORE
        </h2>
        <p style="margin: 0; color: #cbd5e1; font-size: 13.5px;">
            Полное резервное копирование в единый ZIP (база данных + медиа) и безопасное транзакционное восстановление в 1 клик.
        </p>
    </div>
    <div>
        <a href="{% url 'admin_backup_restore' %}" style="background: linear-gradient(135deg, #0284c7, #0ea5e9); color: #ffffff !important; font-weight: 700; text-decoration: none; padding: 12px 24px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);">
            <span>⚡</span> УПРАВЛЕНИЕ BACKUP / RESTORE
        </a>
    </div>
</div>
{{ block.super }}
{% endblock %}
